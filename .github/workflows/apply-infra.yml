name: apply-infra

# Temporary rehearsal only. Never merge this workflow into main.
on:
  push:
    branches: [rehearsal/observability-c-dev9]
    paths:
      - "infra/leak.auto.tfvars"
      - "infra/**.tf"
      - "agent/scenario-c/**"
      - "agent/knowledge/**"
      - "agent/tool-access-policy.api.json"
      - "scripts/lib/sre-agent-reconciler.mjs"
      - "scripts/reconcile-sre-agent.*"
  workflow_dispatch:
    inputs:
      scenario:
        description: "Deployment scenario"
        type: choice
        required: true
        options: [C]
      prefix:
        description: "Resource name prefix"
        required: false
        default: "contosopay"
      environment:
        description: "Environment label"
        required: false
        default: "dev9"
      abandoned_lock_id:
        description: "Exact lock ID from a verified terminated rehearsal run; otherwise leave blank"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: deployment-C-contosopay-dev9
  cancel-in-progress: false

jobs:
  select-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      proceed: ${{ steps.profile.outputs.proceed }}
      scenario: ${{ steps.profile.outputs.scenario }}
      prefix: ${{ steps.profile.outputs.prefix }}
      environment: ${{ steps.profile.outputs.environment }}
    steps:
      - name: Validate selected profile
        id: profile
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          DISPATCH_SCENARIO: ${{ inputs.scenario }}
          DISPATCH_PREFIX: ${{ inputs.prefix }}
          DISPATCH_ENVIRONMENT: ${{ inputs.environment }}
          REPOSITORY_SCENARIO: ${{ vars.DEPLOYMENT_SCENARIO }}
          REPOSITORY_PREFIX: ${{ vars.TF_PREFIX }}
          REPOSITORY_ENVIRONMENT: ${{ vars.TF_ENVIRONMENT }}
        run: |
          set -euo pipefail
          [[ "${EVENT_REF}" == "refs/heads/rehearsal/observability-c-dev9" ]] || { echo "::error::This rehearsal workflow refuses every other branch."; exit 1; }
          if [[ "${REPOSITORY_PREFIX}" == "contosopay" && "${REPOSITORY_ENVIRONMENT}" == "dev9" ]]; then
            echo "::error::The rehearsal cannot target the active deployment."
            exit 1
          fi
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            [[ "${DISPATCH_SCENARIO}" == "C" && "${DISPATCH_PREFIX}" == "contosopay" && "${DISPATCH_ENVIRONMENT}" == "dev9" ]] || { echo "::error::Only the retained C/contosopay/dev9 rehearsal is permitted."; exit 1; }
          elif [[ "${EVENT_NAME}" != "push" ]]; then
            echo "::error::Unsupported rehearsal event."
            exit 1
          fi
          {
            echo "proceed=true"
            echo "scenario=C"
            echo "prefix=contosopay"
            echo "environment=dev9"
          } >> "${GITHUB_OUTPUT}"

  terraform-apply:
    needs: select-profile
    if: ${{ needs.select-profile.outputs.proceed == 'true' }}
    runs-on: ${{ needs.select-profile.outputs.scenario == 'C' && fromJSON('["self-hosted","Linux","X64","azure-private","contosopay"]') || 'ubuntu-latest' }}
    environment: dev-test
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      DEPLOYMENT_SCENARIO: ${{ needs.select-profile.outputs.scenario }}
      TF_PREFIX: ${{ needs.select-profile.outputs.prefix }}
      TF_ENVIRONMENT: ${{ needs.select-profile.outputs.environment }}
      IMAGE_TAG: ${{ github.sha }}
      SRE_AGENT_MODEL_PROVIDER: ${{ vars.SRE_AGENT_MODEL_PROVIDER || 'MicrosoftFoundry' }}
      SRE_AGENT_MODEL_NAME: ${{ vars.SRE_AGENT_MODEL_NAME || 'Automatic' }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Configure scenario
        shell: bash
        run: |
          set -euo pipefail
          readonly SHA_PATTERN='^[0-9a-f]{40}$'
          [[ "${IMAGE_TAG}" =~ ${SHA_PATTERN} ]] || { echo "::error::github.sha is not a full commit SHA."; exit 1; }
          for value in ARM_CLIENT_ID ARM_TENANT_ID ARM_SUBSCRIPTION_ID; do
            [[ -n "${!value}" ]] || { echo "::error::Repository variable ${value} is required."; exit 1; }
          done
          {
            echo "TF_VAR_scenario=${DEPLOYMENT_SCENARIO}"
            echo "TF_VAR_enable_sre_agents=true"
            echo "TF_VAR_sre_agent_model_provider=${SRE_AGENT_MODEL_PROVIDER}"
            echo "TF_VAR_sre_agent_model_name=${SRE_AGENT_MODEL_NAME}"
          } >> "${GITHUB_ENV}"

      - name: Configure Scenario C private networking
        if: ${{ needs.select-profile.outputs.scenario == 'C' }}
        shell: bash
        env:
          RUNNER_NETWORK_RG: ${{ vars.RUNNER_NETWORK_RG || 'agentrg' }}
          RUNNER_VNET_NAME: ${{ vars.RUNNER_VNET_NAME || 'agent-vnet' }}
          RUNNER_PE_SUBNET_NAME: ${{ vars.RUNNER_PE_SUBNET_NAME || 'private-endpoints' }}
          APP_VNET_ADDRESS_SPACE: ${{ vars.DEV_APP_VNET_ADDRESS_SPACE || '10.101.0.0/16' }}
          APP_PE_SUBNET_PREFIX: ${{ vars.DEV_APP_PE_SUBNET_PREFIX || '10.101.0.0/27' }}
          CONTAINER_APPS_SUBNET_PREFIX: ${{ vars.DEV_CONTAINER_APPS_SUBNET_PREFIX || '10.101.0.64/27' }}
          SRE_AGENT_SUBNET_PREFIX: ${{ vars.DEV_SRE_AGENT_SUBNET_PREFIX || '10.101.0.96/27' }}
        run: |
          {
            echo "TF_VAR_runner_vnet_resource_group=${RUNNER_NETWORK_RG}"
            echo "TF_VAR_runner_vnet_name=${RUNNER_VNET_NAME}"
            echo "TF_VAR_runner_private_endpoint_subnet_name=${RUNNER_PE_SUBNET_NAME}"
            echo "TF_VAR_app_vnet_address_space=${APP_VNET_ADDRESS_SPACE}"
            echo "TF_VAR_app_private_endpoint_subnet_address_prefix=${APP_PE_SUBNET_PREFIX}"
            echo "TF_VAR_container_apps_subnet_address_prefix=${CONTAINER_APPS_SUBNET_PREFIX}"
            echo "TF_VAR_sre_agent_subnet_address_prefix=${SRE_AGENT_SUBNET_PREFIX}"
          } >> "${GITHUB_ENV}"

      - name: Configure Scenario C Code Access inputs
        if: ${{ needs.select-profile.outputs.scenario == 'C' }}
        shell: bash
        env:
          CODE_ACCESS_ENABLED: ${{ vars.SRE_CODE_ACCESS_ENABLED || 'false' }}
          CODE_ACCESS_KEY_NAME: ${{ vars.SRE_CODE_ACCESS_GITHUB_APP_PRIVATE_KEY_NAME }}
        run: |
          set -euo pipefail
          [[ "${CODE_ACCESS_ENABLED}" == "true" || "${CODE_ACCESS_ENABLED}" == "false" ]] || { echo "::error::SRE_CODE_ACCESS_ENABLED must be true or false."; exit 1; }
          if [[ "${CODE_ACCESS_ENABLED}" == "true" ]]; then
            [[ -n "${CODE_ACCESS_KEY_NAME}" ]] || { echo "::error::SRE_CODE_ACCESS_GITHUB_APP_PRIVATE_KEY_NAME is required when Code Access is enabled."; exit 1; }
          fi
          echo "TF_VAR_enable_sre_code_access=${CODE_ACCESS_ENABLED}" >> "${GITHUB_ENV}"
          if [[ "${CODE_ACCESS_ENABLED}" == "true" ]]; then
            echo "TF_VAR_sre_code_access_private_key_name=${CODE_ACCESS_KEY_NAME}" >> "${GITHUB_ENV}"
          fi

      - name: Azure login (OIDC)
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure paired-agent monitoring resource provider is registered
        if: ${{ needs.select-profile.outputs.scenario == 'A' || needs.select-profile.outputs.scenario == 'C' }}
        shell: bash
        run: |
          set -euo pipefail
          MONITOR_PROVIDER_STATE="$(az provider show --namespace Microsoft.Monitor --query registrationState -o tsv)"
          if [[ "${MONITOR_PROVIDER_STATE}" != "Registered" ]]; then
            az provider register --namespace Microsoft.Monitor --wait --output none
          fi

      # The runner VNet is shared, so a foreign deployment may already own the
      # privatelink namespaces. Reuse those zones rather than failing to link.
      - name: Discover shared private DNS zones
        if: ${{ needs.select-profile.outputs.scenario == 'C' }}
        uses: ./.github/actions/discover-private-dns-zones
        with:
          runner-vnet-resource-group: ${{ env.TF_VAR_runner_vnet_resource_group }}
          runner-vnet-name: ${{ env.TF_VAR_runner_vnet_name }}
          self-resource-group-prefix: rg-${{ env.TF_PREFIX }}-${{ env.TF_ENVIRONMENT }}-

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Setup Node.js for SRE Agent reconciliation
        if: ${{ needs.select-profile.outputs.scenario == 'C' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      # A destroy leaves the activation variables in place, so a later push can
      # target a profile that no longer exists. Treat that as a no-op instead of
      # a failure; an explicit dispatch still fails loudly.
      - name: Resolve scenario-isolated backend
        id: backend
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          not_deployed() {
            echo "::error::$1"
            exit 1
          }
          STATE_HASH="$(printf '%s\0%s\0%s' "${ARM_SUBSCRIPTION_ID}" "${TF_PREFIX}" "${DEPLOYMENT_SCENARIO}" | sha256sum | cut -c1-16)"
          STATE_RG="rg-${TF_PREFIX}-tfstate"
          STATE_SA="sttf${STATE_HASH}"
          STATE_KEY="${TF_PREFIX}-${DEPLOYMENT_SCENARIO}-${TF_ENVIRONMENT}.tfstate"
          {
            echo "state_rg=${STATE_RG}"
            echo "state_sa=${STATE_SA}"
            echo "state_key=${STATE_KEY}"
          } >> "${GITHUB_OUTPUT}"
          az storage account show -n "${STATE_SA}" -g "${STATE_RG}" >/dev/null 2>&1 \
            || not_deployed "Scenario ${DEPLOYMENT_SCENARIO} backend is absent. Run deploy for Scenario ${DEPLOYMENT_SCENARIO} first."
          EXISTS="$(az storage blob exists --account-name "${STATE_SA}" --container-name tfstate --name "${STATE_KEY}" --auth-mode login --query exists -o tsv)"
          [[ "${EXISTS}" == true ]] \
            || not_deployed "Scenario ${DEPLOYMENT_SCENARIO} state blob is absent. Run deploy for Scenario ${DEPLOYMENT_SCENARIO} first."

      - name: Terraform init and verify scenario
        id: init
        if: ${{ steps.backend.outputs.skip != 'true' }}
        working-directory: infra
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          not_deployed() {
            echo "::error::$1"
            exit 1
          }
          terraform init -input=false \
            -backend-config="resource_group_name=${{ steps.backend.outputs.state_rg }}" \
            -backend-config="storage_account_name=${{ steps.backend.outputs.state_sa }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=${{ steps.backend.outputs.state_key }}"
          terraform state list | grep -Fx 'azurerm_resource_group.this' >/dev/null \
            || not_deployed "State for Scenario ${DEPLOYMENT_SCENARIO} has no deployed environment. Run deploy first."
          ACTUAL_SCENARIO="$(terraform output -raw scenario 2>/dev/null)" || { echo "::error::State has no scenario output; in-place conversion is unsupported."; exit 1; }
          [[ "${ACTUAL_SCENARIO}" == "${DEPLOYMENT_SCENARIO}" ]] || { echo "::error::State scenario '${ACTUAL_SCENARIO}' does not match '${DEPLOYMENT_SCENARIO}'."; exit 1; }
          [[ "$(terraform output -raw resource_group_name)" == "rg-contosopay-dev9-c-oesst9" ]] || { echo "::error::The state does not own the verified temporary environment."; exit 1; }
          echo "TF_LOCATION=$(terraform output -raw location)" >> "${GITHUB_ENV}"

      - name: Unlock verified abandoned rehearsal state
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.abandoned_lock_id != '' }}
        working-directory: infra
        shell: bash
        env:
          ABANDONED_LOCK_ID: ${{ inputs.abandoned_lock_id }}
        run: |
          set -euo pipefail
          readonly LOCK_PATTERN='^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
          [[ "${ABANDONED_LOCK_ID}" =~ ${LOCK_PATTERN} ]] || { echo "::error::An exact Terraform lock ID is required."; exit 1; }
          [[ "$(terraform output -raw scenario)" == "C" ]] || { echo "::error::Wrong scenario before unlock."; exit 1; }
          [[ "$(terraform output -raw resource_group_name)" == "rg-contosopay-dev9-c-oesst9" ]] || { echo "::error::Wrong rehearsal state before unlock."; exit 1; }
          terraform force-unlock -force "${ABANDONED_LOCK_ID}"

      - name: Build and push immutable images
        id: images
        if: ${{ steps.backend.outputs.skip != 'true' && steps.init.outputs.skip != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(terraform -chdir=infra output -raw scenario)" == "${DEPLOYMENT_SCENARIO}" ]] || { echo "::error::Scenario mismatch before image push."; exit 1; }
          ACR_NAME="$(terraform -chdir=infra output -raw acr_name)"
          ACR_LOGIN_SERVER="$(terraform -chdir=infra output -raw acr_login_server)"
          az acr login --name "${ACR_NAME}"
          services=(frontend checkout-api payment-service)
          DIGEST_FILE="${RUNNER_TEMP}/image-digests.json"
          bash scripts/publish-immutable-images.sh \
            "${ACR_NAME}" "${ACR_LOGIN_SERVER}" "${IMAGE_TAG}" "${DIGEST_FILE}" "${services[@]}"
          DIGESTS="$(jq -c . "${DIGEST_FILE}")"
          echo "image_digests=${DIGESTS}" >> "${GITHUB_OUTPUT}"
          echo "TF_VAR_image_digests=${DIGESTS}" >> "${GITHUB_ENV}"

      - name: Terraform apply
        if: ${{ steps.backend.outputs.skip != 'true' && steps.init.outputs.skip != 'true' }}
        working-directory: infra
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(terraform output -raw scenario)" == "${DEPLOYMENT_SCENARIO}" ]] || { echo "::error::Scenario mismatch before apply."; exit 1; }
          PLAN_FILE="${RUNNER_TEMP}/contosopay-dev9-rehearsal.tfplan"
          PLAN_JSON="${RUNNER_TEMP}/contosopay-dev9-rehearsal-plan.json"
          trap 'rm -f -- "${PLAN_FILE}" "${PLAN_JSON}"' EXIT
          terraform plan -input=false -out="${PLAN_FILE}" \
            -var 'deploy_apps=true' -var "image_tag=${IMAGE_TAG}" \
            -var "scenario=${DEPLOYMENT_SCENARIO}" -var "prefix=${TF_PREFIX}" \
            -var "environment=${TF_ENVIRONMENT}" -var "location=${TF_LOCATION}"
          terraform show -json "${PLAN_FILE}" > "${PLAN_JSON}"
          node - "${PLAN_JSON}" <<'NODE'
          const fs = require('node:fs');
          const plan = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (!process.env.ARM_SUBSCRIPTION_ID) throw new Error('Deployment subscription is missing.');
          const allowed = new Set(['frontend', 'checkout-api', 'payment-service'].map(name => `azurerm_container_app.app["${name}"]`));
          const expectedNames = {
            'azurerm_container_app.app["frontend"]': 'ca-frontend-c-oesst9',
            'azurerm_container_app.app["checkout-api"]': 'ca-checkout-c-oesst9',
            'azurerm_container_app.app["payment-service"]': 'ca-payment-c-oesst9',
          };
          for (const resource of plan.resource_changes ?? []) {
            const actions = resource.change.actions;
            if (actions.length === 1 && ['no-op', 'read'].includes(actions[0])) continue;
            if (!allowed.has(resource.address) || actions.length !== 1 || actions[0] !== 'update') {
              throw new Error(`Rehearsal refuses ${resource.address}: ${actions.join(',')}`);
            }
            const before = resource.change.before;
            const after = resource.change.after;
            const expectedId = `/subscriptions/${process.env.ARM_SUBSCRIPTION_ID}/resourceGroups/rg-contosopay-dev9-c-oesst9/providers/Microsoft.App/containerApps/${expectedNames[resource.address]}`;
            if (before.id?.toLowerCase() !== expectedId.toLowerCase() ||
                after.id?.toLowerCase() !== expectedId.toLowerCase() ||
                before.container_app_environment_id !== after.container_app_environment_id ||
                before.resource_group_name !== 'rg-contosopay-dev9-c-oesst9' ||
                after.resource_group_name !== before.resource_group_name ||
                JSON.stringify(before.ingress) !== JSON.stringify(after.ingress) ||
                JSON.stringify(before.identity) !== JSON.stringify(after.identity)) {
              throw new Error(`Rehearsal refuses networking, identity or scope drift: ${resource.address}`);
            }
          }
          console.log('Verified application-only update against the retained rehearsal state.');
          NODE
          terraform apply -input=false "${PLAN_FILE}"
          [[ "$(terraform output -raw scenario)" == "${DEPLOYMENT_SCENARIO}" ]] || { echo "::error::Scenario mismatch after apply."; exit 1; }

      - name: Refresh Azure login for SRE Agent reconciliation
        if: ${{ needs.select-profile.outputs.scenario == 'C' && steps.backend.outputs.skip != 'true' && steps.init.outputs.skip != 'true' }}
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Reconcile and verify Scenario C SRE Agent
        if: ${{ needs.select-profile.outputs.scenario == 'C' && steps.backend.outputs.skip != 'true' && steps.init.outputs.skip != 'true' }}
        shell: bash
        env:
          SRE_CODE_ACCESS_ENABLED: ${{ vars.SRE_CODE_ACCESS_ENABLED || 'false' }}
          SRE_CODE_ACCESS_GITHUB_APP_CLIENT_ID: ${{ vars.SRE_CODE_ACCESS_GITHUB_APP_CLIENT_ID }}
          SRE_CODE_ACCESS_GITHUB_APP_PRIVATE_KEY_NAME: ${{ vars.SRE_CODE_ACCESS_GITHUB_APP_PRIVATE_KEY_NAME }}
          SRE_CODE_ACCESS_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          RESOURCE_GROUP="$(terraform -chdir=infra output -raw resource_group_name)"
          AGENT_NAME="$(terraform -chdir=infra output -json sre_agent_names | jq -r 'to_entries[0].value')"
          export SRE_CODE_ACCESS_KEY_VAULT_MANAGED_IDENTITY_ID
          SRE_CODE_ACCESS_KEY_VAULT_MANAGED_IDENTITY_ID="$(terraform -chdir=infra output -json sre_agent_identities | jq -r 'to_entries[0].value.code_access_resource_id // empty')"
          if [[ "${SRE_CODE_ACCESS_ENABLED}" == "true" ]]; then
            [[ -n "${SRE_CODE_ACCESS_GITHUB_APP_PRIVATE_KEY_NAME}" ]] || { echo "::error::SRE_CODE_ACCESS_GITHUB_APP_PRIVATE_KEY_NAME is required when Code Access is enabled."; exit 1; }
            KEY_VAULT_NAME="$(terraform -chdir=infra output -raw key_vault_name)"
            export SRE_CODE_ACCESS_PRIVATE_KEY_URI="https://${KEY_VAULT_NAME}.vault.azure.net/keys/${SRE_CODE_ACCESS_GITHUB_APP_PRIVATE_KEY_NAME}"
          fi
          node --test scripts/tests/sre-agent-reconciler.test.mjs
          bash scripts/reconcile-sre-agent.sh \
            --mode apply \
            --subscription "${ARM_SUBSCRIPTION_ID}" \
            --resource-group "${RESOURCE_GROUP}" \
            --agent "${AGENT_NAME}"
          bash scripts/reconcile-sre-agent.sh \
            --mode verify \
            --subscription "${ARM_SUBSCRIPTION_ID}" \
            --resource-group "${RESOURCE_GROUP}" \
            --agent "${AGENT_NAME}"

      - name: Summary
        if: ${{ steps.backend.outputs.skip != 'true' && steps.init.outputs.skip != 'true' }}
        working-directory: infra
        shell: bash
        run: |
          {
            echo "## Scenario ${DEPLOYMENT_SCENARIO} infrastructure applied"
            echo ""
            echo "Environment \`${TF_PREFIX}/${TF_ENVIRONMENT}\` now uses immutable image tag \`${IMAGE_TAG}\`."
            echo "The current leak flag was applied through the isolated Terraform state."
          } >> "${GITHUB_STEP_SUMMARY}"
