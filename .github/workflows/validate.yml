name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  offline:
    name: Offline regression checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Check networking fixtures
        run: terraform fmt -check scripts/tests/fixtures/network

      - name: Verify private DNS dependencies and profile matrix
        run: python3 scripts/tests/terraform-network-dependencies.test.py

      - name: Check SRE Agent reconciler
        run: node --test scripts/tests/sre-agent-reconciler.test.mjs scripts/tests/bootstrap-context.test.mjs

      - name: Build services for dependency tracing checks
        run: |
          npm ci --prefix src/frontend
          npm run build --prefix src/frontend
          npm ci --prefix src/checkout-api
          npm run build --prefix src/checkout-api

      - name: Check native fetch dependency tracing
        run: node --test scripts/tests/fetch-telemetry.test.mjs

      - name: Check Scenario D lifecycle offline
        run: |
          python3 scripts/tests/scenario-d-workflows.test.py
          python3 scripts/tests/customer-portability.test.py
          node --test scripts/tests/scenario-d-lifecycle.test.mjs

      - name: Build and lint Scenario D Bicep (no Azure login)
        run: |
          set -euo pipefail
          az bicep install --version v0.48.1
          python3 scripts/tests/scenario-d-bicep.test.py --cli az

      - name: Check whitespace
        run: git diff --check HEAD^ HEAD
